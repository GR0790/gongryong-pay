    <div id="login-modal" style="display:none;">

            <input type="tel" id="user-phone" class="gr-input" maxlength="13" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric" oninput="autoHyphen(this)">
          </div>

          <label class="checkbox-container">

            <span>개인정보 수집 및 이용에 동의합니다 (필수)</span>

          <button id="submit-btn" onclick="submitUserInfo()" disabled>상담 시작하기</button>

    <script>
      /* ───────── 채널톡(Channel Talk) SDK ─────────
         플러그인 키는 공룡페이 전용 키입니다. 다른 사이트 키로 바꾸지 마세요. */
      var GR_CHANNEL_PLUGIN_KEY = "66c596c9-3225-4678-b746-0c024efd6f01";
      (function(){var w=window;if(w.ChannelIO){return w.console.error("ChannelIO script included twice.");}var ch=function(){ch.c(arguments);};ch.q=[];ch.c=function(args){ch.q.push(args);};w.ChannelIO=ch;function l(){if(w.ChannelIOInitialized){return;}w.ChannelIOInitialized=true;var s=document.createElement("script");s.type="text/javascript";s.async=true;s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";var x=document.getElementsByTagName("script")[0];if(x.parentNode){x.parentNode.insertBefore(s,x);}}if(document.readyState==="complete"){l();}else{w.addEventListener("DOMContentLoaded",l);w.addEventListener("load",l);}})();

      // [자동 로그인] 저장된 이름·번호가 있으면 그 정보로 부트합니다.
      var savedPhone = localStorage.getItem('grpay_phone');
      var savedName = localStorage.getItem('grpay_name');

      if (savedPhone) {
          ChannelIO('boot', {
            "pluginKey": GR_CHANNEL_PLUGIN_KEY,
            "hideChannelButtonOnBoot": true,
            "memberId": savedPhone,
            "profile": { "name": savedName, "mobileNumber": savedPhone }
          });
      } else {
          ChannelIO('boot', {
            "pluginKey": GR_CHANNEL_PLUGIN_KEY,
            "hideChannelButtonOnBoot": true
          });
      }

      // [기능 1] 전화번호 자동 하이픈 (-) 추가 및 검사
      window.autoHyphen = function(target) {
          var rawValue = target.value.replace(/[^0-9]/g, '');
          var formatted = '';

          if(rawValue.length < 4) {
              formatted = rawValue;
          } else if(rawValue.length < 8) {
              formatted = rawValue.substr(0, 3) + '-' + rawValue.substr(3);
          } else if(rawValue.length < 12) {
              formatted = rawValue.substr(0, 3) + '-' + rawValue.substr(3, 4) + '-' + rawValue.substr(7);
          } else {
              formatted = rawValue.substr(0, 3) + '-' + rawValue.substr(3, 4) + '-' + rawValue.substr(7, 4);
          }

          target.value = formatted;
          checkValidation();
      }

      // [기능 2] 유효성 검사 (이름 + 번호 형식 + 동의 체크)
      window.checkValidation = function() {
          var nameEl = document.getElementById('user-name');
          var phone = document.getElementById('user-phone').value;
          var isChecked = document.getElementById('privacy-check').checked;
          var submitBtn = document.getElementById('submit-btn');

          var phoneRegex = /^010-\d{4}-\d{4}$/;
          var hasName = !!(nameEl && nameEl.value.trim());

          submitBtn.disabled = !(phoneRegex.test(phone) && isChecked && hasName);
      }

      // 팝업 열기 — 이미 저장된 번호가 있으면 채널톡만 바로 엽니다.
      window.startConsult = function() {
          var checkPhone = localStorage.getItem('grpay_phone');
          if (checkPhone) {
              ChannelIO('showMessenger');
          } else {
              document.getElementById('login-modal').style.display = 'flex';
              document.body.style.overflow = 'hidden';
              var nameEl = document.getElementById('user-name');
              if (nameEl) { setTimeout(function(){ nameEl.focus(); }, 80); }
          }
      }

      // 팝업 닫기
      window.closeModal = function() {
          document.getElementById('login-modal').style.display = 'none';
          document.body.style.overflow = '';
      }

      // 정보 제출 — GTM 커스텀 태그가 이 함수를 감싸서 consultation_submit 을 push 합니다.
      window.submitUserInfo = function() {
          var name = document.getElementById('user-name').value.trim();
          var phone = document.getElementById('user-phone').value.trim();
          var isChecked = document.getElementById('privacy-check').checked;

          if (!name || !isChecked || phone.length !== 13) {
              alert('정보를 정확히 입력해주세요.');
              return;
          }

          var cleanPhone = phone.replace(/-/g, '');

          localStorage.setItem('grpay_name', name);
          localStorage.setItem('grpay_phone', cleanPhone);

          // GTM 래퍼가 설치되어 있으면 래퍼가 전환 이벤트를 push 하므로 여기서는 보내지 않습니다.
          // (래퍼가 없는 환경에서도 전환이 누락되지 않도록 동일한 이름의 이벤트를 직접 push)
          try {
              var wrapped = String(window.submitUserInfo).indexOf('consultation_submit') !== -1;
              if (!wrapped) {
                  window.dataLayer = window.dataLayer || [];
                  window.dataLayer.push({
                      event: 'consultation_submit',
                      user_name: name,
                      user_phone: cleanPhone
                  });
              }
          } catch (e) { /* 전환 이벤트 실패가 상담 연결을 막지 않습니다. */ }

          ChannelIO('shutdown');
          setTimeout(function(){
              ChannelIO('boot', {
                  "pluginKey": GR_CHANNEL_PLUGIN_KEY,
                  "hideChannelButtonOnBoot": true,
                  "memberId": cleanPhone,
                  "profile": { "name": name, "mobileNumber": cleanPhone }
              }, function(error, user) {
                  closeModal();
                  ChannelIO('showMessenger');
              });
          }, 100);
      }
    </script>
